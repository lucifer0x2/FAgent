# FAgent in Docker: `docker compose up -d`, then open http://127.0.0.1:3847 (MCP: /mcp).
# FAGENT_PORT (default 3847) sets the host and container port together, so the server's own
# URLs (render imageUrl, Origin check) match the address the host uses.
# FAGENT_RENDER_BACKEND (default chromium) picks the image's PNG export runtime at build time:
# `FAGENT_RENDER_BACKEND=vello docker compose build` makes an image without Node or Chromium.
# RENDER_BACKEND, when set in the shell or .env, overrides the image's default at startup.
services:
  fagent:
    build:
      context: .
      args:
        FAGENT_RENDER_BACKEND: ${FAGENT_RENDER_BACKEND:-chromium}
    image: fagent:local
    init: true
    restart: unless-stopped
    command:
      - fagent-server
      - --workspace
      - /app
      - --data-root
      - /data
      - --host
      - 0.0.0.0
      - --port
      - "${FAGENT_PORT:-3847}"
    environment:
      # No value: passed through only when set, otherwise the image's build-time default applies.
      RENDER_BACKEND:
    ports:
      # Loopback only: the API has no authentication.
      - "127.0.0.1:${FAGENT_PORT:-3847}:${FAGENT_PORT:-3847}"
    volumes:
      - fagent-data:/data
    # Chromium renders through /dev/shm; Docker's 64 MB default is tight for large frames.
    shm_size: 512m
    healthcheck:
      # bash /dev/tcp, so the check works in both images (the vello image has no Node).
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/${FAGENT_PORT:-3847} && printf 'GET /api/v1/projects HTTP/1.0\\r\\nHost: 127.0.0.1:${FAGENT_PORT:-3847}\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  fagent-data:
