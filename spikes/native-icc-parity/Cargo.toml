[package]
name = "native-icc-parity"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "icc-fixtures"
path = "fixtures/main.rs"

# The server's vello export through the parity adapter protocol (paint-vello's own adapter
# source), without writing its source or outputs.
[[bin]]
name = "icc-native-adapter"
path = "../../crates/paint-vello/src/bin/paint_vello_export.rs"

[dependencies]
fagent-paint-core = { path = "../../crates/paint-core" }
fagent-paint-vello = { path = "../../crates/paint-vello", default-features = false, features = ["export"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
moxcms = { version = "=0.8.1", default-features = false, features = ["lut"] }
jpeg-decoder = { version = "=0.3.2", default-features = false, features = ["platform_independent"] }
