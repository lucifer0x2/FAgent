[package]
name = "fagent-scene-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bindings"]
# The `SceneComputer` wasm-bindgen class. Embedding crates (engine-wasm) disable it.
bindings = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
fagent-layout = { path = "../layout" }
fagent-scene-input = { path = "../scene-input" }
fagent-text = { path = "../text" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
js-sys = { version = "=0.3.106", optional = true }
