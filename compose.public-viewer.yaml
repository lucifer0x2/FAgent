# Opt-in only. Supply FAGENT_PUBLIC_ORIGIN and use alongside compose.yaml.
# Funnel must target FAGENT_PUBLIC_PORT (3848), never FAGENT_PORT (3847).
services:
  fagent:
    environment:
      FAGENT_PUBLIC_TRUSTED_PROXY_IP: "${FAGENT_PUBLIC_TRUSTED_PROXY_IP:-}"
      FAGENT_PUBLIC_LIVE_UPDATES: "${FAGENT_PUBLIC_LIVE_UPDATES:-}"
    command:
      - fagent-server
      - --workspace
      - /app
      - --data-root
      - /data
      - --host
      - 0.0.0.0
      - --port
      - "${FAGENT_PORT:-3847}"
      - --public-viewer-port
      - "${FAGENT_PUBLIC_PORT:-3848}"
      - --public-viewer-origin
      - "${FAGENT_PUBLIC_ORIGIN:?Set the HTTPS Funnel origin, without a path}"
    ports:
      - "127.0.0.1:${FAGENT_PUBLIC_PORT:-3848}:${FAGENT_PUBLIC_PORT:-3848}"
